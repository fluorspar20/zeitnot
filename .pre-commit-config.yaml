# Optional. Enable with: cd backend && uv run pre-commit install --config ../.pre-commit-config.yaml
# (run from the repo root afterwards; hooks use the ruff config in backend/pyproject.toml)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --config, backend/pyproject.toml]
      - id: ruff-format
        args: [--config, backend/pyproject.toml]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024]
